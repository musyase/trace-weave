name: Check
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o trace-weave ./cmd/trace-weave
      - run: ./trace-weave -input sample/checkout.jsonl -format html -output /tmp/report.html
      - run: python3 scripts/check_copy.py README.md
